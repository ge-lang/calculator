<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Scientific Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-main">
            <div class="calculator-header">
                <h1>Scientific Calculator</h1>
                <p class="subtitle">Advanced calculator with history and scientific functions</p>
            </div>

            <div class="mode-toggle">
                <button class="mode-btn active" data-mode="basic">Basic</button>
                <button class="mode-btn" data-mode="scientific">Scientific</button>
                <button class="mode-btn" data-mode="programmer">Programmer</button>
            </div>

            <div class="display-container">
                <div class="previous-operation" id="previousOperation"></div>
                <div class="current-operation" id="currentOperation">0</div>
                <div class="error-message" id="errorMessage"></div>
            </div>

            <div class="buttons-grid" id="buttonsGrid">
                <!-- Buttons will be generated by JavaScript -->
            </div>

            <div class="memory-functions">
                <div class="memory-display" id="memoryDisplay">Memory: Empty</div>
                <button class="calc-btn memory-btn" data-action="memory-clear">MC</button>
                <button class="calc-btn memory-btn" data-action="memory-recall">MR</button>
                <button class="calc-btn memory-btn" data-action="memory-add">M+</button>
                <button class="calc-btn memory-btn" data-action="memory-subtract">M-</button>
            </div>
        </div>

        <div class="history-panel">
            <div class="history-header">
                <h2 class="history-title">Calculation History</h2>
                <button class="clear-history" id="clearHistory">Clear</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="empty-history">No calculations yet</div>
            </div>
        </div>
    </div>

<script defer src="index.js"></script>   
</body>
</html>
